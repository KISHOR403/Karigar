apiVersion: apps/v1
kind: Deployment
metadata:
  name: karigar-api
  labels:
    app: karigar-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: karigar-api
  template:
    metadata:
      labels:
        app: karigar-api
    spec:
      containers:
        - name: api
          image: karigar/api:latest
          ports:
            - containerPort: 4000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "4000"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
